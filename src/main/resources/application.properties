# Local MySQL: create the database/user first using the supplied setup SQL.
# Edit URL and username here; keep real passwords in environment variables.
server.port=${SERVER_PORT:8080}
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.application.name=minibank-transfers-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/transfers?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:transfers_app}
spring.datasource.password=${DB_PASSWORD:local-demo-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
bank.internal-token=${BANK_INTERNAL_TOKEN:local-demo-token}
bank.accounts-url=${ACCOUNTS_URL:http://localhost:8081}
bank.worker-delay-ms=${WORKER_DELAY_MS:1000}
